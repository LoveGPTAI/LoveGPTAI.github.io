<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Search | Jarvis Wang's vibe 筆記</title>
  <link rel="icon" href="https://LoveGPTAI.github.io/images/logo.png" type="image/png">
  <meta name="theme-color" content="#060a11">
  <meta name="description" content="站內搜尋">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://LoveGPTAI.github.io/search/">
  <meta property="og:site_name" content="Jarvis Wang's vibe 筆記">
  <meta property="og:title" content="Search | Jarvis Wang's vibe 筆記">
  <meta property="og:description" content="站內搜尋">
  <meta property="og:url" content="https://LoveGPTAI.github.io/search/">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/site.css">
</head>
<body>
  <div class="container">
    <div class="frame">

      <div class="chrome">
        <div class="layers" aria-hidden="true">
          <span class="layer-chip m1"></span>
          <span class="layer-chip via"></span>
          <span class="layer-chip poly"></span>
        </div>
        <span class="chrome-title"><b>jarvis_wang.gds</b> — layout viewer — cell: SEARCH</span>
        <nav class="chrome-nav">
          <a href="https://LoveGPTAI.github.io/">首頁</a>
          <a href="https://LoveGPTAI.github.io/about">關於</a>
          <a href="https://LoveGPTAI.github.io/blog">部落格</a>
        </nav>
      </div>
      <div class="ruler" aria-hidden="true"></div>

      <main>
        <div class="article-wrap">

          <a class="back-link" href="https://LoveGPTAI.github.io/blog">所有文章</a>

          <h1 class="tag-heading">Search</h1>
          <div class="tag-count">Probe the design — find any net</div>

          <div class="card">
            <p class="card-label"><span class="idx">[01]</span> Query</p>
            <input id="q" class="search-input" type="search" placeholder="輸入關鍵字，例如 EDA、AI、vibe coding…" autocomplete="off" autofocus>
            <div id="results" style="margin-top:20px;"></div>
          </div>

        </div>
      </main>

      <footer class="statusbar">
        <div class="status-group">
          <span class="status-item">DRC: <b>0 errors</b></span>
          <span class="status-item">LVS: <b>clean</b></span>
        </div>
        <div class="status-group">
          <span class="status-item">&copy; <span id="y"></span> Jarvis Wang</span>
          <span class="status-item">25.03°N 121.56°E · TAIPEI</span>
        </div>
      </footer>

    </div>
  </div>
  <script>
    document.getElementById('y').textContent = new Date().getFullYear();

    let index = [];
    fetch('/index.json')
      .then(r => r.json())
      .then(data => { index = data || []; run(); })
      .catch(() => {});

    const q = document.getElementById('q');
    const results = document.getElementById('results');
    const params = new URLSearchParams(location.search);
    if (params.get('keyword')) q.value = params.get('keyword');

    function esc(s) {
      return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function run() {
      const kw = q.value.trim().toLowerCase();
      if (!kw) { results.innerHTML = ''; return; }
      const hits = index.filter(p =>
        (p.title || '').toLowerCase().includes(kw) ||
        (p.contents || '').toLowerCase().includes(kw) ||
        (p.tags || []).some(t => t.toLowerCase().includes(kw))
      );
      if (!hits.length) {
        results.innerHTML = '<p style="color:var(--faint);font-family:var(--mono);font-size:12px;">// no nets matched — try another keyword.</p>';
        return;
      }
      results.innerHTML = hits.map(p => {
        const summary = esc((p.contents || '').slice(0, 120)) + '…';
        return '<div class="post-item">' +
          '<h2 class="post-title-h"><a href="' + esc(p.permalink) + '">' + esc(p.title) + '</a></h2>' +
          '<p class="post-summary">' + summary + '</p>' +
          '<a class="read-more" href="' + esc(p.permalink) + '">Read more</a>' +
          '</div>';
      }).join('');
    }
    q.addEventListener('input', run);
  </script>
</body>
</html>
